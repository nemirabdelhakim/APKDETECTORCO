name: Construire l'APK Android

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer les fichiers
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Installer le SDK Android
        uses: android-actions/setup-android@v3

      - name: Installer les dépendances
        run: npm ci

      - name: Créer le projet Android
        run: npx cap add android

      - name: Configurer (permissions, signature, icônes, version)
        run: node scripts/patch-android.js

      - name: Synchroniser les fichiers de l'application
        run: npx cap sync android

      - name: Compiler l'APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Publier l'APK
        uses: actions/upload-artifact@v4
        with:
          name: Pose-CO-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
